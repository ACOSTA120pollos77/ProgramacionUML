<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Transporte Público</title>
    <link rel="stylesheet" href="/estilos.css">
</head>
<body>

    <main class="acceso">
        <h1>Crear cuenta de pasajero</h1>

        {{mensaje}}

        <div class="caja">
            <form method="post" action="/registro">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="cedula">Cédula</label>
                <input type="text" id="cedula" name="cedula" placeholder="8-000-0000" required>

                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="6000-0000">

                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" required>

                <label for="contrasena">Contraseña (mínimo 6 caracteres)</label>
                <input type="password" id="contrasena" name="contrasena" minlength="6" required>

                <button>Registrarme</button>
            </form>
            <p><a href="/">← Ya tengo cuenta</a></p>
        </div>
    </main>

</body>
</html>
